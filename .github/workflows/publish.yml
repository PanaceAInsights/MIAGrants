name: Publish site

# GitHub Pages serves this site from the gh-pages branch, so every push to the
# working branch is mirrored there and Pages rebuilds within about a minute.

on:
  push:
    branches:
      - claude/github-page-deploy-uihj2u
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish-tmp
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push --force origin publish-tmp:gh-pages
